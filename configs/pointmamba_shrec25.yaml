# PointMamba on SHREC'25 = upstream cfgs/finetune_modelnet.yaml (LMD0311/PointMamba @ 80858e0)
# with cls_dim 40 -> 98 (final release: 98 classes). Data comes from train_shrec25.py (no `dataset:` block).
optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.0003,
    weight_decay: 0.05
  } }

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs: 10
  } }

model: {
  NAME: PointMambaScan,
  trans_dim: 384,
  depth: 12,
  cls_dim: 98,
  num_heads: 6,
  group_size: 32,
  num_group: 64,
  encoder_dims: 384,
  rms_norm: False,
  drop_path: 0.1,
  drop_out: 0.,
  use_cls_token: False,
  max_head: False,
  avg_head: True,
}

npoints: 1024
total_bs: 32
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
# ModelNet recipe of the upstream runner ('scan' not in config name): ScaleAndTranslate
train_aug: scale_translate
