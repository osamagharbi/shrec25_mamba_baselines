# Mamba3D on SHREC'25 = upstream cfgs/finetune_modelnet.yaml (xhanxu/Mamba3D @ b519a9c)
# with cls_dim 40 -> 99. Data comes from train_shrec25.py (no `dataset:` block).
optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

model : {
  NAME: Mamba3D,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.2,
  cls_dim: 99,
  num_heads: 6,
  group_size: 32,
  num_group: 128,
  encoder_dims: 384,
  bimamba_type: "v4",
  center_local_k: 4,
  ordering: False,
  label_smooth: 0.0,
  lr_ratio_cls: 1.,
  lr_ratio_lfa: 1.,
}

npoints: 1024
total_bs : 32
step_per_update : 1
max_epoch : 300
grad_norm_clip : 10
# ModelNet recipe of the upstream runner: per batch FPS 8192 -> 1200, random 1024, ScaleAndTranslate
train_aug: scale_translate
